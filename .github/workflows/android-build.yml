name: CUE LEGENDS Android APK build
on:
  workflow_dispatch:
permissions:
  contents: read
  checks: write
jobs:
  license-check:
    runs-on: ubuntu-latest
    steps:
      - name: Require Unity license secret
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
        shell: bash
        run: |
          if [ -z "$UNITY_LICENSE" ]; then
            echo "::error::Missing repository secret UNITY_LICENSE. Add a valid Unity license through repository Settings > Secrets and variables > Actions. Never commit the license file."
            exit 1
          fi
  build-android:
    needs: license-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run Unity EditMode tests
        uses: game-ci/unity-test-runner@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
        with:
          projectPath: .
          unityVersion: 6000.3.27f1
          testMode: editmode
          coverageEnabled: false
          githubToken: ${{ secrets.GITHUB_TOKEN }}
      - name: Build Android APK
        uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
        with:
          projectPath: .
          unityVersion: 6000.3.27f1
          targetPlatform: Android
          buildMethod: OneShotFootball.Editor.AndroidBuild.BuildAndroidApk
          customParameters: -quit
      - uses: actions/upload-artifact@v4
        with:
          name: CUE-LEGENDS-Android-APK
          path: Builds/Android/CUELEGENDS.apk
          if-no-files-found: error
          retention-days: 14
