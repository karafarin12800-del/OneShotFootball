name: Source validation
on:
  push:
    branches: [main, "feature/**"]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate Unity project metadata and source
        shell: bash
        run: |
          set -euo pipefail
          test -f ProjectSettings/ProjectVersion.txt
          test -f Packages/manifest.json
          test -f Assets/Scripts/PoolGameController.cs
          test -f Assets/Editor/ProjectBootstrap.cs
          test -f Assets/Editor/AndroidBuild.cs
          test -f Docs/CUE_LEGENDS_PRODUCT_PLAN.md
          python3 - <<'PY'
          import json
          from pathlib import Path
          manifest = json.loads(Path("Packages/manifest.json").read_text())
          assert "com.unity.test-framework" in manifest["dependencies"]
          assert "6000.3.27f1" in Path("ProjectSettings/ProjectVersion.txt").read_text()
          for path in Path("Assets").rglob("*.cs"):
              source = path.read_text(encoding="utf-8")
              assert "\\x00" not in source, f"NUL byte in {path}"
              assert source.count("{") == source.count("}"), f"Brace mismatch in {path}"
          print("CUE LEGENDS source checks passed.")
          PY
      - name: Check for tracked credentials
        shell: bash
        run: |
          set -euo pipefail
          if git ls-files | grep -E '(^|/)([^/]*\\.jks|[^/]*\\.keystore|google-services\\.json|[^/]*\\.pem|[^/]*\\.p12)$'; then
            echo "Unexpected credential/signing file is tracked."
            exit 1
          fi
